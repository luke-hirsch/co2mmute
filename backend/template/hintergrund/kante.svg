<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 186" role="img" aria-labelledby="fig-kante-title fig-kante-desc" class="fig">
  <!--
    A link of the queue model, twice: in free flow (cars drive t0, queue
    briefly, leave at Q) and in spillback (the next link is full, nothing
    leaves, the queue fills the storage S and the next car cannot enter).
    A schematic, not a measurement — no number is drawn to scale.
    Colours: every fill and stroke is a var() with a token value as its
    fallback. On /hintergrund/ the page sets the vars (custom.css, .doc-figure)
    and they follow the light/dark switch; standalone — the docs on GitHub —
    the fallbacks paint the light version on a white card.
  -->
  <title id="fig-kante-title">Eine Kante im freien Fluss und im Rückstau</title>
  <desc id="fig-kante-desc">Oben fahren einzelne Autos mit Abstand über die Kante, am Ende stehen drei kurz in der Schlange, und vorn fließt der Verkehr mit der Abflusskapazität Q ab. Unten ist die nächste Kante voll: Die Schlange füllt die ganze Kante, ein Halt sperrt die Ausfahrt, und ein ankommendes Auto kommt nicht mehr hinein.</desc>
  <style>
    .fig-bg { fill: var(--fig-bg, #ffffff); }
    .fig-text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-variant-numeric: tabular-nums; fill: var(--fig-muted, #6b7280); }
    .fig-ink { fill: var(--fig-ink, #111827); }
    .fig-head { fill: var(--fig-ink, #111827); font-weight: 500; }
    .fig-line { fill: none; stroke: var(--fig-ink, #111827); }
    .fig-grid { fill: none; stroke: var(--fig-rule, #d7dbe1); }
    .fig-edge { fill: var(--fig-surface, #ffffff); stroke: var(--fig-strong, #bcc3cc); }
    .fig-node { fill: var(--fig-surface, #ffffff); stroke: var(--fig-ink, #111827); }
    .fig-car { fill: var(--fig-car, #1e88e5); }
    .fig-car-line { fill: none; stroke: var(--fig-car, #1e88e5); }
    .fig-pt { fill: var(--fig-pt, #ffb300); }
    .fig-people { fill: var(--fig-soft, #8b93a1); }
    .fig-people-line { fill: none; stroke: var(--fig-soft, #8b93a1); }
  </style>
  <rect class="fig-bg" width="344" height="186" rx="8" />
  <text class="fig-head fig-text" x="12" y="20">Freier Fluss</text>
  <rect class="fig-edge" x="40" y="32" width="240" height="20" rx="3" stroke-width="1.5" />
  <rect class="fig-car" x="60" y="38" width="11" height="8" rx="2" />
  <rect class="fig-car" x="104" y="38" width="11" height="8" rx="2" />
