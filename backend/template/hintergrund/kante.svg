  <path class="fig-line" d="M292 42 H326 M320 37 L326 42 L320 47" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text class="fig-text" x="309" y="31" text-anchor="middle">Q</text>
  <path class="fig-line" d="M40 62 V68 H280 V62" stroke-width="1" />
  <text class="fig-text" x="160" y="84" text-anchor="middle">Speicher S, eine Kante lang</text>
  <text class="fig-head fig-text" x="12" y="118">Rückstau</text>
