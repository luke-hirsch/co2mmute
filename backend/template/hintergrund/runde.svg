<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 220" role="img" aria-labelledby="fig-runde-title fig-runde-desc" class="fig">
  <!--
    What a round costs on the shipped map, by car share — the table under
    "6.400 ist, was der Graph verkraftet" in docs/de-hintergrund.md, measured
    S23 (2026-10-01): base version, 64 Gruppen x 100, six seeds, the rest on
    public transport. Bars: x = 60 + 196 · kg / 13 059, the budget line at
    8 000 kg. Re-measure, then move the numbers here and in both docs.
    Colours: every fill and stroke is a var() with a token value as its
    fallback. On /hintergrund/ the page sets the vars (custom.css, .doc-figure)
    and they follow the light/dark switch; standalone — the docs on GitHub —
    the fallbacks paint the light version on a white card.
  -->
  <title id="fig-runde-title">Was eine Runde kostet, nach Autoanteil</title>
  <desc id="fig-runde-desc">Fünf gestapelte Balken für 100, 75, 50, 25 und 0 Prozent Autoanteil: 13.059, 9.884, 7.184, 5.345 und 3.194 kg CO₂. Der Anteil des Fahrplans bleibt fast gleich bei 2.864 bis 3.194 kg, der des Autos schrumpft von 10.194 kg auf null. Das Budget von 8.000 kg pro Runde liegt zwischen 75 und 50 Prozent.</desc>
  <style>
    .fig-bg { fill: var(--fig-bg, #ffffff); }
    .fig-text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-variant-numeric: tabular-nums; fill: var(--fig-muted, #6b7280); }
    .fig-ink { fill: var(--fig-ink, #111827); }
    .fig-head { fill: var(--fig-ink, #111827); font-weight: 500; }
    .fig-line { fill: none; stroke: var(--fig-ink, #111827); }
    .fig-grid { fill: none; stroke: var(--fig-rule, #d7dbe1); }
    .fig-edge { fill: var(--fig-surface, #ffffff); stroke: var(--fig-strong, #bcc3cc); }
    .fig-node { fill: var(--fig-surface, #ffffff); stroke: var(--fig-ink, #111827); }
    .fig-car { fill: var(--fig-car, #1e88e5); }
    .fig-car-line { fill: none; stroke: var(--fig-car, #1e88e5); }
    .fig-pt { fill: var(--fig-pt, #ffb300); }
    .fig-people { fill: var(--fig-soft, #8b93a1); }
    .fig-people-line { fill: none; stroke: var(--fig-soft, #8b93a1); }
  </style>
  <rect class="fig-bg" width="344" height="220" rx="8" />
  <text class="fig-text" x="12" y="24">Autoanteil</text>
  <rect class="fig-car" x="60" y="40" width="153.0" height="18" />
  <rect class="fig-pt" x="213.0" y="40" width="43.0" height="18" />
  <rect class="fig-car" x="60" y="70" width="103.6" height="18" />
  <rect class="fig-pt" x="163.6" y="70" width="44.7" height="18" />
  <rect class="fig-car" x="60" y="100" width="62.5" height="18" />
  <rect class="fig-pt" x="122.5" y="100" width="45.3" height="18" />
  <rect class="fig-car" x="60" y="130" width="33.1" height="18" />
  <rect class="fig-pt" x="93.1" y="130" width="47.1" height="18" />
  <rect class="fig-pt" x="60.0" y="160" width="47.9" height="18" />
  <line class="fig-line" x1="180.1" x2="180.1" y1="32" y2="186" stroke-width="1.5" stroke-dasharray="4 3" />
  <text class="fig-text" x="180.1" y="24" text-anchor="middle">Budget 8.000 kg</text>
  <text class="fig-head fig-text" x="52" y="53.5" text-anchor="end">100 %</text>
  <text class="fig-text" x="332" y="53.5" text-anchor="end">13.059 kg</text>
  <text class="fig-head fig-text" x="52" y="83.5" text-anchor="end">75 %</text>
  <text class="fig-text" x="332" y="83.5" text-anchor="end">9.884 kg</text>
  <text class="fig-head fig-text" x="52" y="113.5" text-anchor="end">50 %</text>
  <text class="fig-text" x="332" y="113.5" text-anchor="end">7.184 kg</text>
  <text class="fig-head fig-text" x="52" y="143.5" text-anchor="end">25 %</text>
  <text class="fig-text" x="332" y="143.5" text-anchor="end">5.345 kg</text>
  <text class="fig-head fig-text" x="52" y="173.5" text-anchor="end">0 %</text>
  <text class="fig-text" x="332" y="173.5" text-anchor="end">3.194 kg</text>
  <rect class="fig-car" x="60" y="196" width="12" height="12" />
  <text class="fig-text" x="78" y="206">Auto</text>
  <rect class="fig-pt" x="130" y="196" width="12" height="12" />
  <text class="fig-text" x="148" y="206">Fahrplan, Bus und Bahn</text>
</svg>
