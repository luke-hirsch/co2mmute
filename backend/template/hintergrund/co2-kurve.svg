<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 236" role="img" aria-labelledby="fig-co2-kurve-title fig-co2-kurve-desc" class="fig">
  <!--
    The car's emission factor over speed, EF(v) = a/v + b + c·v², capped at
    2.00 × EF(50). Computed from sim/constants.py: c = 0.0028605,
    a = 2c·70³ = 1962.3 g/h, b = 166.8 − a/50 − c·50² = 120.4 g/km.
    Plot: x = 52 + 272·v/130, y = 196 − 168·g/350.
    Colours: every fill and stroke is a var() with a token value as its
    fallback. On /hintergrund/ the page sets the vars (custom.css, .doc-figure)
    and they follow the light/dark switch; standalone — the docs on GitHub —
    the fallbacks paint the light version on a white card.
  -->
  <title id="fig-co2-kurve-title">CO₂ eines Autos über der Geschwindigkeit</title>
  <desc id="fig-co2-kurve-desc">Die Kurve fällt von 333,6 g pro Kilometer bei Schrittgeschwindigkeit auf 166,8 g bei 50 km/h, erreicht bei 70 km/h ihr Minimum von 162,5 g und steigt danach wieder leicht an. Unterhalb von 9,2 km/h hält ein Deckel sie beim Doppelten des Werts bei 50 km/h.</desc>
