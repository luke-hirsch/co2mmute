{% extends "base.html" %}<!-- even more comments -->
{% block title %}Neues Passwort gesetzt {%endblock %}
<!-- even more comments -->
{% block main %}
<section class="mx-auto w-full max-w-xl px-6 py-20 text-center">
  <div class="rounded-3xl border border-subtle bg-surface p-12 shadow-xl">
    <span
      class="mx-auto inline-flex h-16 w-16 items-center justify-center rounded-2xl bg-primary-100 text-2xl text-primary-700 shadow-lg"
    >
      🎉
    </span>
    <h1 class="mt-6 text-3xl font-semibold text-primary-700">
      Password erfolgreich zurückgesetzt
    </h1>
    <p class="mt-4 text-sm text-muted">
      Dein neues Passwort ist bereit zur Verwendung. Melde dich erneute an.
    </p>
    <div
      class="mt-8 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-center"
    >
      <a class="btn-primary w-full sm:w-auto" href="{% url 'login' %}">
        Zum Login
      </a>
      <a class="btn-secondary w-full sm:w-auto" href="{% url 'index' %}">
        Home
      </a>
    </div>
  </div>
</section>
{% endblock %}
