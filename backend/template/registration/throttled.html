{% extends "base.html" %}
{% block title %}Zu viele Versuche{% endblock %}
{% block main %}
<section class="mx-auto w-full max-w-3xl px-6 py-20">
  <h1 class="mb-4 text-2xl font-semibold text-main dark:text-darktext">
    Zu viele Versuche
  </h1>
  <p class="mb-6 max-w-(--measure-body) text-mutedtext dark:text-darkmutedtext">
    {{ throttle_message }}
  </p>
  <p class="max-w-(--measure-body) text-mutedtext dark:text-darkmutedtext">
    Warte {{ throttle_minutes }} Minuten und versuch es dann noch einmal.
  </p>
  <p class="mt-8">
    <a
      href="{% url 'index' %}"
      class="text-primary-600 underline hover:no-underline dark:text-primary-400"
      >Zurück zur Startseite</a
    >
  </p>
</section>
{% endblock %}
