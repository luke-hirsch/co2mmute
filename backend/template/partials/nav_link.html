{# One navigation item as a link, or as plain text when the CMS gave it nowhere to go. A link in another language says so. #}{% if item.href %}<a href="{{ item.href }}"{% if item.lang %} lang="{{ item.lang }}" hreflang="{{ item.lang }}"{% endif %} class="{{ link_class }}">{{ item.label }}</a>{% else %}<span class="{{ link_class }}">{{ item.label }}</span>{% endif %}
