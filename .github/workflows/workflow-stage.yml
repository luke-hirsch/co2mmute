name: Deploy to staging

on:
  push:
    branches: ["stage"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_KEY }}

      - name: Configure known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.STAGING_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: SSH smoke test
        run: |
          ssh -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o PreferredAuthentications=publickey \
            ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} \
            "whoami && hostname"

      - name: Deploy
        run: |
          ssh -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o PreferredAuthentications=publickey \
            ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} \
            "cd /srv/commute && git fetch origin && git checkout stage && git pull --ff-only origin stage && docker compose -f devops/docker-compose.yaml up -d --build"
