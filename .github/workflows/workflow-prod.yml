name: go live

on:
  push:
    branches: ["prod"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_DB: co2mmute
          POSTGRES_USER: co2mmute
          POSTGRES_PASSWORD: co2mmute
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U co2mmute -d co2mmute"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: co2mmute
      POSTGRES_USER: co2mmute
      POSTGRES_PASSWORD: co2mmute
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run the suite
        working-directory: backend
        run: ./manage.py test --settings=co2mmute.settings_test

  # A copy of the one in test.yml: two workflows cannot `needs:` each other.
  # The e2e job is not copied — test.yml runs on this push too, beside the
  # deploy, so its result is there to read without holding the deploy up.
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check the app
        run: npx tsc -b
      - name: Type-check the unit tests
        run: npx tsc -p tests --noEmit
      - name: Type-check the e2e specs
        run: npx tsc -p e2e --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npx vite build

  deploy:
    runs-on: ubuntu-latest
    needs: [test, frontend]

    steps:
      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.KEY }}

      - name: Configure known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: SSH smoke test
        run: |
          ssh -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o PreferredAuthentications=publickey \
            ${{ secrets.USER }}@${{ secrets.HOST }} \
            "whoami && hostname"

      - name: Deploy
        run: |
          ssh -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o PreferredAuthentications=publickey \
            ${{ secrets.USER }}@${{ secrets.HOST }} \
            "cd /commute && git fetch origin && git checkout -B prod origin/prod && docker compose -f devops/docker-compose.yaml up -d --build && docker image prune -f"
