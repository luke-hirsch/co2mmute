name: go live

on:
  push:
    branches: ["prod"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_DB: co2mmute
          POSTGRES_USER: co2mmute
          POSTGRES_PASSWORD: co2mmute
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U co2mmute -d co2mmute"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: co2mmute
      POSTGRES_USER: co2mmute
      POSTGRES_PASSWORD: co2mmute
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run the suite
        working-directory: backend
        run: ./manage.py test --settings=co2mmute.settings_test

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.KEY }}

      - name: Configure known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: SSH smoke test
        run: |
          ssh -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o PreferredAuthentications=publickey \
            ${{ secrets.USER }}@${{ secrets.HOST }} \
            "whoami && hostname"

      - name: Deploy
        run: |
          ssh -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o PreferredAuthentications=publickey \
            ${{ secrets.USER }}@${{ secrets.HOST }} \
            "cd /commute && git fetch origin && git checkout -B prod origin/prod && docker compose -f devops/docker-compose.yaml up -d --build && docker image prune -f"
