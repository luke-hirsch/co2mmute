name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_DB: co2mmute
          POSTGRES_USER: co2mmute
          POSTGRES_PASSWORD: co2mmute
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U co2mmute -d co2mmute"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: co2mmute
      POSTGRES_USER: co2mmute
      POSTGRES_PASSWORD: co2mmute
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for missing migrations
        working-directory: backend
        run: ./manage.py makemigrations --check --dry-run --settings=co2mmute.settings_test

      - name: Run the suite
        working-directory: backend
        run: ./manage.py test --settings=co2mmute.settings_test --verbosity=2
