services:
  postgres:
    restart: unless-stopped
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-co2mmute}
      POSTGRES_USER: ${POSTGRES_USER:-co2mmute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-co2mmute}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.4-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: co2mmute-backend
    environment: &backend-env
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://localhost}
      DJANGO_STATIC_ROOT: /var/www/backend-static
      DJANGO_MEDIA_ROOT: /var/www/backend-media
      DJANGO_DB_WAIT_TIMEOUT: ${DJANGO_DB_WAIT_TIMEOUT:-60}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in devops/.env}
      DJANGO_BASE_URL: ${DJANGO_BASE_URL:-localhost}
      POSTGRES_DB: ${POSTGRES_DB:-co2mmute}
      POSTGRES_USER: ${POSTGRES_USER:-co2mmute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-co2mmute}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend-static:/var/www/backend-static
      - backend-media:/var/www/backend-media
      - backend-logs:/app/logs

  # celery-worker:
  #   image: co2mmute-backend
  #   environment: *backend-env
  #   command: ["celery", "-A", "co2mmute", "worker", "-l", "${CELERY_WORKER_LOG_LEVEL:-info}"]
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   restart: unless-stopped

  # celery-beat:
  #   image: co2mmute-backend
  #   environment: *backend-env
  #   command: ["celery", "-A", "co2mmute", "beat", "-l", "${CELERY_BEAT_LOG_LEVEL:-info}"]
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   restart: unless-stopped


  
  nginx:
    build:
      context: ..
      dockerfile: devops/nginx/Dockerfile
      args:
        VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL:-/api}
    image: co2mmute-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - backend-static:/var/www/backend-static:ro
      - backend-media:/var/www/backend-media:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  backend-static:
  backend-media:
  backend-logs:
  redis-data:
  postgres-data:
